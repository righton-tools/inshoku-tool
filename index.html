<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>飲食店共有ツール</title>
<meta name="theme-color" content="#B7542C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="店ツール">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/icon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="icons/icon-180.png">
<style>
:root{--bg:#F6F3EE;--card:#fff;--ink:#27231F;--mut:#7B7268;--line:#E3DCD2;--soft:#EFEAE2;--acc:#B7542C;--ok:#3F7A4C;--ng:#B23A3A;--warn:#C98A1C;--blue:#3E6C9D}
*{box-sizing:border-box}html{background:var(--bg)}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic","Meiryo",system-ui,sans-serif;font-size:15px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top)}
.wrap{max-width:560px;margin:0 auto;padding:12px 14px 96px}.wide{max-width:1040px}h1{font-size:19px;margin:8px 0 2px}h2{font-size:15px;margin:0 0 8px;color:var(--mut);letter-spacing:.04em}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-top:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
label.l{font-size:12px;color:var(--mut);display:block;margin-bottom:3px}input,select,textarea,button{font:inherit;color:inherit}
input[type=text],input[type=number],input[type=date],input[type=password],input[type=url],select,textarea{border:1px solid var(--line);border-radius:10px;padding:9px 10px;background:#FBF9F6;width:100%}
input[type=number]{font-variant-numeric:tabular-nums}.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 13px;cursor:pointer}.chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--acc);color:#fff;width:100%;cursor:pointer;font-size:16px;text-decoration:none;display:block;text-align:center}.btn.g{background:var(--soft);color:var(--ink)}.btn.s{width:auto;padding:8px 12px;font-size:13px;display:inline-block}.btn:disabled{opacity:.5}
.menu{display:grid;grid-template-columns:1fr 132px;gap:6px;align-items:center;padding:8px 0;border-top:1px dashed var(--line)}.menu:first-child{border-top:0}.menu .n{font-weight:600}.menu .n small{color:var(--mut);font-weight:400;margin-left:6px}
.step{display:grid;grid-template-columns:40px 1fr 40px;gap:4px}.step button{border:1px solid var(--line);background:#fff;border-radius:10px;height:40px;font-size:20px;cursor:pointer}.step input{text-align:center;padding:6px;height:40px}
.cat{font-size:12px;color:var(--mut);letter-spacing:.06em;margin:10px 0 2px;font-weight:700}.msg{text-align:center;color:var(--ok);font-size:13px;min-height:18px;margin-top:8px}.err{color:var(--ng)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}.kpi{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px 12px}.kpi .v{font-size:24px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}.kpi .l{font-size:11px;color:var(--mut)}.kpi .d{font-size:11px;color:var(--mut)}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}th{color:var(--mut);font-weight:600;font-size:11px}td:first-child,th:first-child{text-align:left}.tbl{overflow-x:auto}
.al{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:start;padding:10px;border:1px solid var(--line);border-radius:12px;margin-top:8px;background:#fff}.tag{font-weight:700;border-radius:8px;padding:4px 0;text-align:center;font-size:13px;color:#fff}.tag.ムダ{background:var(--warn)}.tag.ムリ{background:var(--ng)}.tag.ムラ{background:var(--blue)}
.al .t{font-weight:700}.al .e{font-size:12px;color:var(--mut)}.al .p{font-size:13px;margin-top:3px}svg.ch{width:100%;height:auto;display:block}.bar{height:10px;background:var(--soft);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:720px){.grid2{grid-template-columns:1fr}}.sud{display:grid;grid-template-columns:1fr 70px 70px 30px;gap:6px;margin-top:6px;align-items:center}.sud button{border:0;background:none;color:var(--mut);cursor:pointer}
.sticky{position:fixed;left:0;right:0;bottom:0;background:rgba(246,243,238,.96);border-top:1px solid var(--line);padding:10px 14px calc(10px + env(safe-area-inset-bottom))}.sticky .in{max-width:560px;margin:0 auto}.hint{font-size:12px;color:var(--mut)}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px}.top a{color:var(--mut);text-decoration:none;font-size:13px}
.home{display:grid;gap:10px;margin-top:14px}.home .big{padding:22px 16px;font-size:18px}
.logo{width:56px;height:56px;border-radius:14px;vertical-align:middle;margin-right:10px}
.screen{display:none}.screen.on{display:block}
</style>
</head>
<body>
<div id="app"></div>

<!-- ============ ホーム ============ -->
<template id="t-home">
<div class="wrap">
  <h1><img class="logo" src="icons/icon-192.png" alt="">飲食店共有ツール</h1>
  <p class="hint">スマホは「ホーム画面に追加」、PCはアドレスバー右の「インストール」でアプリとして使えます。</p>
  <div class="home">
    <a class="btn big" href="#input">現場の日次入力</a>
    <a class="btn big g" href="#admin">責任者の管理画面</a>
  </div>
  <div class="card">
    <h2>この端末の設定</h2>
    <label class="l">店舗の入力キー（店舗マスタの「入力キー」）</label>
    <input type="text" id="h-key" placeholder="例 sakura01">
    <label class="l" style="margin-top:8px">接続先（Apps ScriptのウェブアプリURL）</label>
    <input type="url" id="h-api" placeholder="https://script.google.com/macros/s/…/exec">
    <button class="btn g" style="margin-top:10px" id="h-save">保存</button>
    <div class="msg" id="h-msg"></div>
    <p class="hint">他の店・他社で使う時は、台帳をコピーして公開したURLと入力キーをここに入れるだけ。</p>
  </div>
</div>
</template>

<!-- ============ 現場入力 ============ -->
<template id="t-input">
<div class="wrap">
  <div class="top"><h1 id="ttl">日次入力</h1><a href="#home">ホーム</a></div>
  <div class="card"><div class="row"><div style="flex:1"><label class="l">日付</label><input type="date" id="date"></div><div style="flex:1"><label class="l">入力者</label><input type="text" id="whoIn" placeholder="名前"></div></div>
    <label class="l" style="margin-top:8px">天候</label><div class="row" id="wx"><button class="chip" data-w="晴">晴</button><button class="chip" data-w="曇">曇</button><button class="chip" data-w="雨">雨</button><button class="chip" data-w="雪">雪</button></div>
    <div class="row" style="margin-top:8px"><div style="flex:1"><label class="l">気温(℃)</label><input type="number" id="temp" inputmode="decimal"></div><div style="flex:1"><label class="l">湿度(%)</label><input type="number" id="humid" inputmode="numeric"></div></div></div>
  <div class="card"><h2>来店数</h2><div class="step" style="grid-template-columns:56px 1fr 56px"><button data-bump="-1">−</button><input type="number" id="visitors" inputmode="numeric" placeholder="0"><button data-bump="1">＋</button></div></div>
  <div class="card"><h2>メニュー別 注文数</h2><div id="menus" class="hint">読み込み中…</div></div>
  <div class="card"><h2>働いた時間（全員の合計）</h2><div class="row"><div style="flex:1"><label class="l">人数</label><input type="number" id="ppl" inputmode="decimal" placeholder="例 3"></div><div style="flex:1"><label class="l">1人あたり平均時間</label><input type="number" id="hrs" inputmode="decimal" placeholder="例 8"></div><div style="flex:1"><label class="l">合計人時</label><input type="number" id="hours" inputmode="decimal" placeholder="自動 or 直接"></div></div><p class="hint">人数×時間を入れると合計が自動で入ります。バラバラなら合計だけ直接入力でOK。</p></div>
  <div class="card"><h2>光熱メーター（閉店時の読み）</h2><p class="hint" id="prevm">前回：—</p><div class="row"><div style="flex:1"><label class="l">電気</label><input type="number" id="me" inputmode="decimal"></div><div style="flex:1"><label class="l">ガス</label><input type="number" id="mg" inputmode="decimal"></div><div style="flex:1"><label class="l">水道</label><input type="number" id="mw" inputmode="decimal"></div></div></div>
  <div class="card"><h2>突発作業</h2><div id="suds"></div><button class="btn g s" style="margin-top:8px" id="addSud">＋ 追加</button></div>
  <div class="card"><h2>メモ</h2><textarea id="memo" rows="2" placeholder="気づき・お客様の声など"></textarea></div>
  <div id="res" class="msg"></div>
</div>
<div class="sticky"><div class="in"><button class="btn" id="save">この日を保存</button></div></div>
</template>

<!-- ============ 管理画面 ============ -->
<template id="t-admin">
<div class="wrap wide">
  <div id="gate" class="card" style="max-width:360px;margin:40px auto"><div class="top"><h2>管理画面</h2><a href="#home">ホーム</a></div><label class="l">PIN</label><input type="password" id="pin" inputmode="numeric"><button class="btn" style="margin-top:10px" id="enter">入る</button><div class="msg err" id="gerr"></div></div>
  <div id="dash" hidden>
    <div class="top"><h1 id="sname">管理画面</h1><div class="row"><select id="shop" style="width:auto"></select><select id="days" style="width:auto"><option value="7">7日</option><option value="14">14日</option><option value="30" selected>30日</option><option value="90">90日</option></select><button class="btn g s" id="reload">更新</button><a href="#home">ホーム</a></div></div>
    <div class="kpis" id="kpis"></div>
    <div class="grid2"><div class="card"><h2>売上と来店数の推移</h2><div id="chart"></div></div>
    <div class="card"><h2>明日の見込み・必要人役</h2><div id="fc"></div></div></div>
    <div class="card"><h2>ムダ・ムリ・ムラ（自動検出）</h2><p class="hint">「改善サイクルへ」を押すと改善案として登録され、担当・期限・状態を管理できます。</p><div id="alerts"></div></div>
    <div class="card"><h2>改善サイクル</h2><div class="tbl"><table id="kai"></table></div><div class="row" style="margin-top:8px"><input type="text" id="kt" placeholder="手動で追加：内容" style="flex:2"><select id="ktype" style="width:auto"><option>ムダ</option><option>ムリ</option><option>ムラ</option></select><button class="btn g s" id="addManual">追加</button></div></div>
    <div class="card"><h2>メニュー別（期間合計）</h2><div class="tbl"><table id="mt"></table></div></div>
    <div class="card"><h2>日次一覧</h2><div class="tbl"><table id="dt"></table></div></div>
  </div>
</div>
</template>

<script>
/* ===================== 接続 ===================== */
var DEFAULT_API = 'https://script.google.com/macros/s/AKfycbxzSQ1G2liiTlPdU1NbBAcjvc5D18oIgy5Ue4T6k9a7R1fv9-plckKp3IoabgfpMH6BBw/exec';
function ls(k,v){ try{ if(v===undefined) return localStorage.getItem(k); if(v===null) localStorage.removeItem(k); else localStorage.setItem(k,v); }catch(e){ return null; } }
function apiUrl(){ return ls('hz_api')||DEFAULT_API; }
async function gs(fn){ var args=Array.prototype.slice.call(arguments,1);
  var r=await fetch(apiUrl(),{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({fn:fn,args:args}),redirect:'follow'});
  var t=await r.text(); try{ return JSON.parse(t); }catch(e){ throw new Error('接続先の応答が読めません。接続先URLと公開設定（全員）を確認してください。'); } }
var $=function(s){ return document.querySelector(s); };
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function yen(n){ return '¥'+Math.round(n||0).toLocaleString(); } function pct(n){ return (Math.round((n||0)*10)/10)+'%'; }
function today(){ var d=new Date(); return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2); }
function mount(id){ var t=document.getElementById(id); $('#app').innerHTML=''; $('#app').appendChild(t.content.cloneNode(true)); window.scrollTo(0,0); }

/* ===================== ルーティング ===================== */
function route(){
  var h=(location.hash||'#home').slice(1); var q={}; var m=location.search.slice(1).split('&'); m.forEach(function(p){ var kv=p.split('='); if(kv[0]) q[decodeURIComponent(kv[0])]=decodeURIComponent(kv[1]||''); });
  if(q.s){ ls('hz_key',q.s); } if(q.api){ ls('hz_api',q.api); }
  if(q.s||q.api){ history.replaceState(null,'',location.pathname+location.hash); }
  if(h==='input') pageInput(); else if(h==='admin') pageAdmin(); else pageHome();
}
window.addEventListener('hashchange',route);

/* ===================== ホーム ===================== */
function pageHome(){
  mount('t-home'); $('#h-key').value=ls('hz_key')||''; $('#h-api').value=ls('hz_api')||DEFAULT_API;
  $('#h-save').onclick=function(){ ls('hz_key',$('#h-key').value.trim()); var a=$('#h-api').value.trim(); ls('hz_api', a&&a!==DEFAULT_API?a:null); $('#h-msg').textContent='保存しました'; };
}

/* ===================== 現場入力 ===================== */
function pageInput(){
  mount('t-input'); var KEY=ls('hz_key')||''; var D=null, orders={}, suds=[];
  if(!KEY){ $('#menus').innerHTML='<span class=err>店舗の入力キーが未設定です。ホームで設定してください。</span>'; $('#save').disabled=true; return; }
  function load(date){ $('#menus').textContent='読み込み中…'; gs('apiInputData',KEY,date).then(render).catch(function(e){ $('#res').innerHTML='<span class=err>'+esc(e.message)+'</span>'; }); }
  function render(d){ if(d.error){ $('#menus').innerHTML='<span class=err>'+esc(d.error)+'</span>'; $('#save').disabled=true; return; } D=d;
    $('#ttl').textContent=d.store.name+'  日次入力'; $('#date').value=d.date; var r=d.record||{}; orders=r.orders||{}; suds=r.suds||[];
    $('#whoIn').value=r.who||ls('hz_who')||''; $('#temp').value=r.temp==null?'':r.temp; $('#humid').value=r.humid==null?'':r.humid; $('#visitors').value=r.visitors||''; $('#hours').value=r.hours||''; $('#ppl').value=''; $('#hrs').value=''; $('#memo').value=r.memo||'';
    var m=r.meter||{}; $('#me').value=m.e==null?'':m.e; $('#mg').value=m.g==null?'':m.g; $('#mw').value=m.w==null?'':m.w;
    $('#prevm').textContent=d.prevMeter?'前回('+d.prevMeter.date.slice(5)+')：電気 '+d.prevMeter.e+' / ガス '+d.prevMeter.g+' / 水道 '+d.prevMeter.w:'前回の読みなし（初回は使用量0になります）';
    document.querySelectorAll('#wx .chip').forEach(function(b){ b.classList.toggle('on',b.dataset.w===(r.weather||'')); });
    var cats={}; d.menus.forEach(function(x){ (cats[x.cat]=cats[x.cat]||[]).push(x); }); var h='';
    Object.keys(cats).forEach(function(c){ h+='<div class=cat>'+esc(c)+'</div>'; cats[c].forEach(function(x){ h+='<div class=menu><div class=n>'+esc(x.name)+'<small>¥'+x.price.toLocaleString()+'</small></div><div class=step><button data-o="'+esc(x.id)+'" data-n="-1">−</button><input type=number inputmode=numeric id="o_'+esc(x.id)+'" value="'+(orders[x.id]||'')+'" placeholder=0><button data-o="'+esc(x.id)+'" data-n="1">＋</button></div></div>'; }); });
    $('#menus').innerHTML=h; renderSuds(); $('#res').textContent=r.who?'保存済みの内容を表示中（上書きできます）':''; }
  function renderSuds(){ $('#suds').innerHTML=suds.map(function(s,i){ return '<div class=sud><input type=text placeholder=内容 data-si="'+i+'" data-f=text value="'+esc(s.text||'')+'"><input type=number inputmode=numeric placeholder=分 data-si="'+i+'" data-f=min value="'+esc(s.min||'')+'"><input type=text placeholder=担当 data-si="'+i+'" data-f=who value="'+esc(s.who||'')+'"><button data-del="'+i+'">×</button></div>'; }).join('')||'<p class=hint>なし</p>'; }
  $('#menus').addEventListener('click',function(ev){ var b=ev.target.closest('[data-o]'); if(!b)return; var id=b.dataset.o; var inp=document.getElementById('o_'+id); var v=Math.max(0,(+inp.value||0)+(+b.dataset.n)); inp.value=v||''; orders[id]=v; });
  $('#menus').addEventListener('input',function(ev){ if(ev.target.id&&ev.target.id.indexOf('o_')===0) orders[ev.target.id.slice(2)]=+ev.target.value||0; });
  document.querySelectorAll('[data-bump]').forEach(function(b){ b.onclick=function(){ var v=Math.max(0,(+$('#visitors').value||0)+(+b.dataset.bump)); $('#visitors').value=v||''; }; });
  $('#suds').addEventListener('input',function(ev){ var i=ev.target.dataset.si; if(i==null)return; suds[+i][ev.target.dataset.f]=ev.target.dataset.f==='min'?+ev.target.value:ev.target.value; });
  $('#suds').addEventListener('click',function(ev){ var b=ev.target.closest('[data-del]'); if(!b)return; suds.splice(+b.dataset.del,1); renderSuds(); });
  $('#addSud').onclick=function(){ suds.push({text:'',min:'',who:''}); renderSuds(); };
  $('#wx').addEventListener('click',function(e){ var b=e.target.closest('.chip'); if(!b)return; document.querySelectorAll('#wx .chip').forEach(function(x){ x.classList.toggle('on',x===b&&!x.classList.contains('on')); }); });
  ['#ppl','#hrs'].forEach(function(i){ $(i).addEventListener('input',function(){ var p=+$('#ppl').value,h=+$('#hrs').value; if(p&&h)$('#hours').value=Math.round(p*h*10)/10; }); });
  $('#date').addEventListener('change',function(){ load(this.value); });
  $('#save').onclick=function(){ if(!D)return; var w=document.querySelector('#wx .chip.on');
    var p={date:$('#date').value,weather:w?w.dataset.w:'',temp:$('#temp').value,humid:$('#humid').value,visitors:+$('#visitors').value||0,orders:orders,hours:+$('#hours').value||0,meter:{e:$('#me').value,g:$('#mg').value,w:$('#mw').value},suds:suds,memo:$('#memo').value,who:$('#whoIn').value};
    if(!p.visitors&&!Object.keys(orders).some(function(k){return orders[k]>0;})){ if(!confirm('来店数も注文も0のまま保存しますか？'))return; }
    ls('hz_who',p.who); $('#save').disabled=true; $('#res').textContent='保存中…';
    gs('apiSaveDaily',KEY,p).then(function(r){ $('#save').disabled=false; if(r.error){ $('#res').innerHTML='<span class=err>'+esc(r.error)+'</span>'; return; } $('#res').textContent='保存しました。売上 ¥'+r.sales.toLocaleString()+' ／ 粗利 ¥'+r.gp.toLocaleString()+' ／ 必要人時 '+r.reqH+'h（'+r.reqMan+'人役）'; })
      .catch(function(e){ $('#save').disabled=false; $('#res').innerHTML='<span class=err>'+esc(e.message)+'</span>'; }); };
  load(today());
}

/* ===================== 管理画面 ===================== */
function pageAdmin(){
  mount('t-admin'); var PIN=sessionStorage.getItem('hz_pin')||''; var DASH=null;
  function loadDash(){ $('#gerr').textContent=''; var st=$('#shop').value||null; gs('apiAdmin',PIN,'dash',{storeId:st,days:+$('#days').value}).then(render).catch(function(e){ $('#gerr').textContent=e.message; $('#gate').hidden=false; }); }
  $('#enter').onclick=function(){ PIN=$('#pin').value; sessionStorage.setItem('hz_pin',PIN); loadDash(); };
  $('#pin').addEventListener('keydown',function(e){ if(e.key==='Enter') $('#enter').click(); });
  $('#reload').onclick=loadDash; $('#shop').onchange=loadDash; $('#days').onchange=loadDash;
  function render(d){ if(d.error){ $('#gerr').textContent=d.error; $('#gate').hidden=false; return; } DASH=d; $('#gate').hidden=true; $('#dash').hidden=false; $('#sname').textContent=(d.store['店舗名']||'')+' 管理画面';
    if($('#shop').options.length!==d.shops.length){ $('#shop').innerHTML=d.shops.map(function(s){ return '<option value="'+esc(s.id)+'"'+(s.id===d.store['店舗ID']?' selected':'')+'>'+esc(s.name)+'</option>'; }).join(''); }
    var ds=d.days; var sum=function(k){ return ds.reduce(function(a,r){ return a+(+r[k]||0); },0); };
    var sales=sum('売上'),vis=sum('来店数'),cost=sum('材料原価')+sum('資材費'),labor=sum('人件費'),util=sum('光熱費'),vp=sum('変動利益'),reqH=sum('必要人時'),actH=sum('実働人時');
    var cr=sales?cost/sales*100:0,lr=sales?labor/sales*100:0;
    var K=[['売上',yen(sales),ds.length+'日'],['来店数',vis.toLocaleString()+'人','1日平均 '+(ds.length?Math.round(vis/ds.length):0)+'人'],['客単価',vis?yen(sales/vis):'–',''],['原価率',pct(cr),'目標 '+d.settings.tgtCost+'%',cr>d.settings.tgtCost?'var(--ng)':'var(--ok)'],['人件費率',pct(lr),'目標 '+d.settings.tgtLabor+'%',lr>d.settings.tgtLabor?'var(--ng)':'var(--ok)'],['変動利益',yen(vp),'粗利−人件費−光熱費（固定費除く）'],['必要人時 / 実働',Math.round(reqH)+'h / '+Math.round(actH)+'h',reqH?'実働÷必要 '+Math.round(actH/reqH*100)+'%':'',reqH&&(actH/reqH>1.2||actH/reqH<0.85)?'var(--warn)':'var(--ink)'],['光熱費',yen(util),vis?Math.round(util/vis)+'円/人':'']];
    $('#kpis').innerHTML=K.map(function(k){ return '<div class=kpi><div class=l>'+k[0]+'</div><div class=v style="color:'+(k[3]||'var(--ink)')+'">'+k[1]+'</div><div class=d>'+k[2]+'</div></div>'; }).join('');
    chart(ds); forecast(d.forecast); alerts(d.alerts); kaizen(d.kaizen); menuTable(d.menus,sales); dayTable(ds); }
  function chart(ds){ if(!ds.length){ $('#chart').innerHTML='<p class=hint>記録がありません</p>'; return; } var W=520,H=180,px=44,py=10,n=ds.length; var mx=Math.max.apply(null,ds.map(function(r){return +r['売上']||0;}))||1; var mv=Math.max.apply(null,ds.map(function(r){return +r['来店数']||0;}))||1;
    var x=function(i){ return px+(W-px-40)*(n===1?0:i/(n-1)); }, y1=function(v){ return py+(H-py-24)*(1-v/mx); }, y2=function(v){ return py+(H-py-24)*(1-v/mv); };
    var p1='',p2=''; ds.forEach(function(r,i){ p1+=(i?'L':'M')+x(i).toFixed(1)+' '+y1(+r['売上']||0).toFixed(1); p2+=(i?'L':'M')+x(i).toFixed(1)+' '+y2(+r['来店数']||0).toFixed(1); });
    var step=Math.max(1,Math.round(n/6)); var xl=ds.map(function(r,i){ return (i%step===0||i===n-1)?'<text x='+x(i).toFixed(1)+' y='+(H-6)+' font-size=10 text-anchor=middle fill=#7B7268>'+r['日付'].slice(5).replace('-','/')+'</text>':''; }).join('');
    $('#chart').innerHTML='<svg class=ch viewBox="0 0 '+W+' '+H+'">'+[0,0.5,1].map(function(t){ return '<line x1='+px+' x2='+(W-40)+' y1='+y1(mx*t)+' y2='+y1(mx*t)+' stroke=#E3DCD2 /><text x='+(px-4)+' y='+(y1(mx*t)+4)+' font-size=10 text-anchor=end fill=#7B7268>'+Math.round(mx*t/1000)+'k</text><text x='+(W-36)+' y='+(y2(mv*t)+4)+' font-size=10 fill=#3E6C9D>'+Math.round(mv*t)+'人</text>'; }).join('')+xl+'<path d="'+p1+'" fill=none stroke=#B7542C stroke-width=2.2 /><path d="'+p2+'" fill=none stroke=#3E6C9D stroke-width=2 stroke-dasharray="5 3" /></svg><div class=hint><span style=color:#B7542C>■</span> 売上 　<span style=color:#3E6C9D>- -</span> 来店数</div>'; }
  function forecast(f){ if(!f){ $('#fc').innerHTML='<p class=hint>データが溜まると表示されます</p>'; return; } $('#fc').innerHTML='<div class=kpis><div class=kpi><div class=l>'+esc(f.date)+' 来店見込み</div><div class=v>'+f.visitors+'人</div><div class=d>'+esc(f.basis)+'</div></div><div class=kpi><div class=l>必要人時</div><div class=v>'+f.reqH+'h</div><div class=d>'+f.reqMan+'人役（1人役='+DASH.settings.manHours+'h）</div></div></div><p class=hint style=margin-top:8px>主な材料の理論使用量（発注・仕込みの目安）</p>'+f.mats.map(function(m){ return '<div class=row style="justify-content:space-between;font-size:13px"><span>'+esc(m.name)+'</span><b>'+esc(m.qty)+'</b></div>'; }).join(''); }
  function alerts(a){ if(!a.length){ $('#alerts').innerHTML='<p class=hint>今のところ大きなムダ・ムリ・ムラは見つかっていません（データが増えると精度が上がります）</p>'; return; } var reg=DASH.kaizen.map(function(k){return k.title;});
    $('#alerts').innerHTML=a.map(function(x,i){ var done=reg.indexOf(x.title)>=0; return '<div class=al><div class="tag '+x.type+'">'+x.type+'</div><div><div class=t>'+esc(x.title)+'</div><div class=e>'+esc(x.evidence)+'</div><div class=p>案：'+esc(x.plan)+'</div></div><div>'+(done?'<span class=hint>登録済</span>':'<button class="btn g s" data-reg="'+i+'">改善サイクルへ</button>')+'</div></div>'; }).join('');
    document.querySelectorAll('[data-reg]').forEach(function(b){ b.onclick=function(){ var x=DASH.alerts[+b.dataset.reg]; var who=prompt('担当者（空欄可）','')||''; var due=prompt('期限（YYYY-MM-DD、空欄可）','')||''; gs('apiAdmin',PIN,'addKaizen',{storeId:DASH.store['店舗ID'],item:{type:x.type,title:x.title,evidence:x.evidence,plan:x.plan,who:who,due:due}}).then(loadDash); }; }); }
  $('#addManual').onclick=function(){ var t=$('#kt').value.trim(); if(!t)return; gs('apiAdmin',PIN,'addKaizen',{storeId:DASH.store['店舗ID'],item:{type:$('#ktype').value,title:t,evidence:'手動登録',plan:''}}).then(function(){ $('#kt').value=''; loadDash(); }); };
  function upd(id,f,v){ var a={id:id}; a[f]=v; gs('apiAdmin',PIN,'updKaizen',a); }
  function kaizen(k){ if(!k.length){ $('#kai').innerHTML='<tr><td class=hint>まだありません</td></tr>'; return; } var st=['未着手','実行中','完了','見送り'];
    $('#kai').innerHTML='<tr><th>登録</th><th>種別</th><th style=text-align:left>内容</th><th style=text-align:left>改善案</th><th>担当</th><th>期限</th><th>状態</th><th style=text-align:left>効果メモ</th></tr>'+k.map(function(r){ return '<tr><td>'+esc(r.date.slice(5))+'</td><td><span class="tag '+r.type+'" style="padding:2px 8px">'+r.type+'</span></td><td style="text-align:left;white-space:normal;min-width:180px">'+esc(r.title)+'<div class=hint>'+esc(r.evidence||'')+'</div></td><td style="text-align:left;white-space:normal;min-width:180px">'+esc(r.plan||'')+'</td><td><input type=text value="'+esc(r.who||'')+'" style="width:80px;padding:4px" data-k="'+esc(r.id)+'" data-f=who></td><td>'+esc(r.due||'')+'</td><td><select style="width:auto;padding:4px" data-k="'+esc(r.id)+'" data-f=status>'+st.map(function(s){ return '<option'+(s===r.status?' selected':'')+'>'+s+'</option>'; }).join('')+'</select></td><td><input type=text value="'+esc(r.effect||'')+'" style="width:160px;padding:4px" data-k="'+esc(r.id)+'" data-f=effect></td></tr>'; }).join('');
    document.querySelectorAll('#kai [data-k]').forEach(function(el){ el.onchange=function(){ upd(el.dataset.k,el.dataset.f,el.value); }; }); }
  function menuTable(m,total){ var mx=Math.max.apply(null,m.map(function(r){return r.sales;}))||1; $('#mt').innerHTML='<tr><th>メニュー</th><th>売価</th><th>原価</th><th>原価率</th><th>注文数</th><th>売上</th><th>構成比</th><th>粗利</th><th style=text-align:left>　</th></tr>'+m.map(function(r){ var cr=r.price?r.unitCost/r.price*100:0; return '<tr><td>'+esc(r.name)+'<span class=hint> '+esc(r.cat)+'</span></td><td>'+yen(r.price)+'</td><td>'+yen(r.unitCost)+'</td><td style="color:'+(cr>DASH.settings.tgtCost?'var(--ng)':'inherit')+'">'+pct(cr)+'</td><td>'+r.qty+'</td><td>'+yen(r.sales)+'</td><td>'+(total?pct(r.sales/total*100):'–')+'</td><td>'+yen(r.gp)+'</td><td style="min-width:120px"><div class=bar><i style="width:'+(r.sales/mx*100)+'%"></i></div></td></tr>'; }).join(''); }
  function dayTable(ds){ var cols=['日付','曜日','天候','来店数','売上','客単価','原価率','粗利','必要人時','実働人時','人件費率','光熱費','突発分','変動利益']; $('#dt').innerHTML='<tr>'+cols.map(function(c){ return '<th'+(c==='日付'?' style=text-align:left':'')+'>'+c+'</th>'; }).join('')+'</tr>'+ds.slice().reverse().map(function(r){ return '<tr>'+cols.map(function(c){ var v=r[c]; if(['売上','粗利','光熱費','変動利益','客単価'].indexOf(c)>=0)v=yen(v||0); if(['原価率','人件費率'].indexOf(c)>=0)v=pct(+v||0); if(c==='日付')v=String(v).slice(5); return '<td'+(c==='日付'?' style=text-align:left':'')+'>'+esc(v==null?'':v)+'</td>'; }).join('')+'</tr>'; }).join(''); }
  if(PIN){ $('#pin').value=PIN; loadDash(); }
}

/* ===================== 起動 ===================== */
route();
if('serviceWorker' in navigator){ navigator.serviceWorker.register('sw.js').catch(function(){}); }
</script>
